name: Valideer inzendingen

# Draait op elke pull request en op elke push naar main. Wat hier rood wordt,
# komt het register niet in. Dat is geen moderatie maar rekenwerk: de bot zegt
# precies wat er mist, en daar valt niet over te discussieren.

on:
  pull_request:
    paths: ["observations/**", "schema/**", "rules/**", "registry/**", "tools/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet jsonschema pyyaml

      - name: Records toetsen
        id: check
        run: |
          set -o pipefail
          python3 tools/validate.py 2>&1 | tee /tmp/report.txt

      - name: Reproductiescripts starten
        # Niet de meting zelf: die vereist netwerk naar het doelwit en dat doen
        # we niet vanuit CI. Wel de vraag of het script uberhaupt laadt, want
        # een record dat naar een kapot script verwijst is niet reproduceerbaar.
        run: |
          for f in repro/*/*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f" && echo "ok  $f"
          done

      - name: Regels narekenen op meegeleverd bewijs
        # Dit is wat CVE niet kan: als er een HAR bij de inzending zit, draaien
        # we de regel erop en vergelijken we met wat het record beweert.
        run: |
          if ls observations/_evidence/*.har >/dev/null 2>&1; then
            python3 tools/replay.py observations/_evidence/*.har
          else
            echo "geen bewijsbestanden in deze wijziging"
          fi

      - name: Uitslag terugkoppelen op de pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.txt', 'utf8');
            const ok = !body.includes('FOUT');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: [
                ok ? '### Alles in orde' : '### Dit moet nog gebeuren',
                '',
                ok ? 'De inzending voldoet aan het schema en aan de publicatieregels. Een uitgever kijkt er nu naar.'
                   : 'Hieronder staat wat er nog ontbreekt. Dit is geen afwijzing: vul aan en de controle draait opnieuw. Kom je er niet uit, zeg het en we helpen.',
                '', '```', body.slice(0, 60000), '```', '',
                'Zie CONTRIBUTING.md voor wat elk veld betekent en waarom het er is.'
              ].join('\n')
            });
