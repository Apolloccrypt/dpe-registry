# DPE detection rule (stub, opgezet uit bestaande records)
#
# TODO voor een mens: vul requires_capture en does_not_establish aan, en
# controleer of de indicator hieronder scherp genoeg is om zonder oordeel
# toegepast te kunnen worden. Zolang deze regel er staat, is de rule niet af.

id: handover
rule_version: 1
pattern: handover
info:
  name: Handover
  family: chain
  authors: [dpe-registry]

requires_capture:
  profile: clean
  interaction: none
  artefact: har
  attribution: [har-pageref]
  forbidden_attribution:
    - referer   # spoofbaar, en meetinstrumentatie doet dat ook

match:
  indicator: >
    Set-Cookie op een host onder een andere registrable domain dan de gastheer

qod:
  method: network-with-identifier
  value: 95
  basis: traffic-property

falsifiers:
  - condition: de cookies zijn strikt noodzakelijk voor het formulier
    check: manual
    on_true: reclassify
  - condition: er is wel een consent-laag die de meting miste
    check: automated
    on_true: drop
  - condition: de checkboxes worden niet per persoon opgeslagen maar alleen gebruikt voor routering
    check: manual
    on_true: reclassify

does_not_establish:
  - lawfulness; that is for a supervisory authority or a court
  - absence: no detection in one capture is not evidence of absence
  # TODO: wat deze regel specifiek niet kan zien

reproduction:
  manual: repro/handover/MANUAL.md      # TODO: schrijven
  script: repro/handover/handover.mjs     # TODO: schrijven
  independent:
    - urlscan.io
    - webbkoll
