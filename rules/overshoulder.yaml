# DPE detection rule (stub, opgezet uit bestaande records)
#
# TODO voor een mens: vul requires_capture en does_not_establish aan, en
# controleer of de indicator hieronder scherp genoeg is om zonder oordeel
# toegepast te kunnen worden. Zolang deze regel er staat, is de rule niet af.

id: overshoulder
rule_version: 1
pattern: overshoulder
info:
  name: Overshoulder
  family: data
  authors: [dpe-registry]

requires_capture:
  profile: clean
  interaction: none
  artefact: har
  attribution: [har-pageref]
  forbidden_attribution:
    - referer   # spoofbaar, en meetinstrumentatie doet dat ook

match:
  indicator: >
    request naar het session-recording-endpoint van de vendor, site-id 4942343; duur onafhankelijk bevestigd via wayback op marker Hotjar site 4942343

qod:
  method: network-with-identifier
  value: 95
  basis: traffic-property

falsifiers:
  - condition: de opname startte pas na toestemming
    check: automated
    on_true: drop
  - condition: de vendor verwerkt uitsluitend geaggregeerd, zonder sessie-opname
    check: automated
    on_true: drop

does_not_establish:
  - lawfulness; that is for a supervisory authority or a court
  - absence: no detection in one capture is not evidence of absence
  # TODO: wat deze regel specifiek niet kan zien

reproduction:
  manual: repro/overshoulder/MANUAL.md      # TODO: schrijven
  script: repro/overshoulder/overshoulder.mjs     # TODO: schrijven
  independent:
    - urlscan.io
    - webbkoll
