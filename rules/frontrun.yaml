# DPE detection rule
#
# Modelled on the way vulnerability scanners confirm a CVE: never by exploiting
# it, always by finding a deterministic indicator whose presence settles the
# question. The rule is machine-readable and versioned; the human write-up lives
# separately in registry/frontrun.md and changes on its own schedule.

id: frontrun
rule_version: 1
pattern: frontrun
info:
  name: A tag fires before the consent question has been answered
  family: consent
  authors: [dpe-registry]

# ---------------------------------------------------------------------------
# Capture requirements. A rule that runs on the wrong capture produces a
# confident wrong answer, so these are preconditions, not suggestions.
# ---------------------------------------------------------------------------
requires_capture:
  profile: clean                # a warm profile may carry prior consent
  interaction: none             # nothing clicked, nothing dismissed
  consent_mode: noop            # the capture must be the no-interaction mode
  artefact: har                 # with request timings and set-cookie headers
  attribution: [har-pageref, cdp-initiator]
  forbidden_attribution:
    - referer                   # spoofable, and stealth instrumentation spoofs it

# ---------------------------------------------------------------------------
# The indicator. All conditions must hold. This is the equivalent of a version
# string matching a vulnerable range: presence settles it, no exploit needed.
# ---------------------------------------------------------------------------
match:
  all:
    - signal: request.host
      is_third_party_to: target.registrable_domain
    - signal: request.host
      in_list: lists/measurement-hosts.txt
    - signal: request.timestamp
      before: capture.consent_event      # absent consent event => whole capture qualifies
    - any:
        - signal: request.query
          matches: '(^|[?&])(cid|tid|_ga|uid|sid|dl|en)='
        - signal: response.set_cookie
          matches: '^(_ga|_gid|_fbp|_hj)'

# ---------------------------------------------------------------------------
# Quality of detection. Borrowed from OpenVAS: the number describes the METHOD,
# not the seriousness. It is what stops a weak method from being cited as if it
# were a strong one.
# ---------------------------------------------------------------------------
qod:
  method: network-observed-with-identifier
  value: 95
  ladder:
    static-source: 60           # id present in fetched HTML; may be dead code
    network-observed: 90        # request actually seen on the wire
    network-with-identifier: 95 # request carries an id or sets a cookie
    differential: 97            # difference between consent modes established
    third-party-confirmed: 99   # independent public scan agrees
    archival-continuous: 99     # unbroken snapshot run; proves duration, not current behaviour

# ---------------------------------------------------------------------------
# Falsifiers. Each must be evaluated before a record leaves draft. Directly
# comparable to a VEX justification: present is not the same as exploitable.
# ---------------------------------------------------------------------------
falsifiers:
  - id: first-party-cname
    condition: measurement host resolves as a CNAME under the target's own domain
    check: dns.cname_chain(request.host) ends_with target.registrable_domain
    on_true: reclassify            # still an exposure, but not third-party by host
  - id: no-identifier
    condition: request carries no identifier and sets no cookie
    check: not match.any
    on_true: drop
  - id: prior-consent
    condition: consent was granted in an earlier session on the same profile
    check: capture.profile == "clean"
    on_true: drop
  - id: interaction-induced
    condition: the tag only fired because the capture clicked something
    check: capture.interaction == "none"
    on_true: drop

# ---------------------------------------------------------------------------
# What this rule may not conclude. Written into the rule so the limitation
# travels with every record it generates.
# ---------------------------------------------------------------------------
does_not_establish:
  - lawfulness; that is for a supervisory authority or a court
  - absence: no detection on one page load is not evidence of absence
  - purpose: the rule sees the flow, not what the recipient does with it
  - geography of the recipient; that is the JU axis, measured separately

# ---------------------------------------------------------------------------
# Reproduction must not depend on registry tooling.
# ---------------------------------------------------------------------------
reproduction:
  manual: repro/frontrun/MANUAL.md
  script: repro/frontrun/frontrun.mjs
  independent:
    - urlscan.io                 # permanent third-party result URL
    - webbkoll                   # EU-hosted
    - blacklight
