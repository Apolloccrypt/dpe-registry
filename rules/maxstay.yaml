# DPE detection rule (stub, opgezet uit bestaande records)
#
# TODO voor een mens: vul requires_capture en does_not_establish aan, en
# controleer of de indicator hieronder scherp genoeg is om zonder oordeel
# toegepast te kunnen worden. Zolang deze regel er staat, is de rule niet af.

id: maxstay
rule_version: 1
pattern: maxstay
info:
  name: MaxStay
  family: consent
  authors: [dpe-registry]

requires_capture:
  profile: clean
  interaction: none
  artefact: har
  attribution: [har-pageref]
  forbidden_attribution:
    - referer   # spoofbaar, en meetinstrumentatie doet dat ook

match:
  indicator: >
    Set-Cookie met een bewaartermijn van 399 dagen voor het consent-event

qod:
  method: network-with-identifier
  value: 95
  basis: traffic-property

falsifiers:
  - condition: de cookie is strikt noodzakelijk voor een door de bezoeker gevraagde dienst
    check: automated
    on_true: drop
  - condition: de cookie is strikt noodzakelijk voor een gevraagde dienst
    check: automated
    on_true: drop

does_not_establish:
  - lawfulness; that is for a supervisory authority or a court
  - absence: no detection in one capture is not evidence of absence
  # TODO: wat deze regel specifiek niet kan zien

reproduction:
  manual: repro/maxstay/MANUAL.md      # TODO: schrijven
  script: repro/maxstay/maxstay.mjs     # TODO: schrijven
  independent:
    - urlscan.io
    - webbkoll
