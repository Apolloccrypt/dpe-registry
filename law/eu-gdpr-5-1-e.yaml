id: eu-gdpr-5-1-e
jurisdiction: EU
instrument: "Verordening (EU) 2016/679 (AVG)"
reference: "GDPR art. 5(1)(e)"
reference_nl: "AVG art. 5 lid 1 sub e"
title: "Opslagbeperking"
core: >
  Persoonsgegevens mogen niet langer worden bewaard in een vorm die het mogelijk
  maakt de betrokkene te identificeren dan noodzakelijk is voor de doeleinden
  waarvoor zij worden verwerkt.
why_it_matters: >
  Een vergelijking die klaar is, is klaar. Blijft de waarneming daarna bestaan,
  dan bewaart de verwerking iets waarvoor het doel al bereikt is. Dat geldt voor
  de aflezing die geen treffer opleverde net zo goed als voor het monster van een
  geslaagde controle, en het is meetbaar tegen de bewaarconfiguratie van dezelfde
  datum in plaats van tegen de belofte in een document.
url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
verified: true
