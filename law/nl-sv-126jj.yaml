id: nl-sv-126jj
jurisdiction: NL
instrument: "Wetboek van Strafvordering"
reference: "Sv art. 126jj"
title: "Vastleggen en bewaren van kentekengegevens"
core: >
  Kentekengegevens van passerende voertuigen worden met technische hulpmiddelen
  vastgelegd en gedurende een bij wet bepaalde termijn bewaard, waarna zij
  worden vernietigd. De vastlegging betreft alle passages, ook die van
  voertuigen die met geen enkel gegeven in een vergelijkingsbestand
  overeenkomen.
why_it_matters: >
  Dit is de bepaling die laat zien waarom het onderscheid tussen een treffer en
  een niet-treffer de kern van de meting is. Waar een wet de bewaring van
  niet-treffers uitdrukkelijk regelt, verschuift de vraag van of het mag naar
  of de praktijk binnen die regeling blijft; waar zo'n grondslag ontbreekt,
  staat de bewaring van iedereen die passeert op zichzelf.
url: "https://wetten.overheid.nl/BWBR0001903"
mirror: "https://vrijewetgeving.nl/"
verified: false
verification_note: >
  Artikelnummer en strekking zijn opgeschreven uit kennis van de regeling, niet
  tegen de brontekst gecontroleerd. De bewaartermijn is bewust niet genoemd:
  controleer artikel, termijn en de actuele redactie voordat een publicatie
  erop steunt.
entries: [DPE-2026-0024]
