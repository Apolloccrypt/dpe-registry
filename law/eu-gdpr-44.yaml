id: eu-gdpr-44
jurisdiction: EU
instrument: "Verordening (EU) 2016/679 (AVG)"
reference: "GDPR art. 44"
reference_nl: "AVG art. 44"
title: "Algemeen beginsel voor doorgiften naar derde landen"
core: >
  Doorgifte van persoonsgegevens naar een derde land is alleen toegestaan als de
  voorwaarden van hoofdstuk V worden nageleefd, zodat het beschermingsniveau van
  de verordening niet wordt ondermijnd.
why_it_matters: >
  Relevant zodra de JU-as van de vector op 3C of HR staat. Let op het onderscheid
  dat het register hanteert: waar een bedrijf vandaan komt is geen doorgifte. De
  bestemming is meetbaar, de herkomst niet ter zake.
